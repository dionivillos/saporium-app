<!doctype html>
<html lang="es">
  <head>
    <title>Bizcocho de yogur</title>
  </head>
  <body>
    <article itemscope itemtype="https://schema.org/Recipe">
      <h1 itemprop="name">Bizcocho de yogur</h1>
      <p itemprop="description">El del vaso de yogur como medida.</p>
      <meta itemprop="prepTime" content="PT15M" />
      <meta itemprop="cookTime" content="PT35M" />
      <span itemprop="recipeYield">8 raciones</span>
      <ul>
        <li itemprop="recipeIngredient">1 yogur natural</li>
        <li itemprop="recipeIngredient">2 vasos de az&uacute;car</li>
        <li itemprop="recipeIngredient">3 vasos de harina</li>
      </ul>
      <ol>
        <li itemprop="recipeInstructions">Mezcla el yogur con el az&uacute;car.</li>
        <li itemprop="recipeInstructions">A&ntilde;ade la harina tamizada.<br />Remueve bien.</li>
        <li itemprop="recipeInstructions">Hornea 35 minutos a 180&deg;.</li>
      </ol>
    </article>
  </body>
</html>
